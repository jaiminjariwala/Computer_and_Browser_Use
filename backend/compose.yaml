services:
  db:
    # Anonymous mirror of Docker Library's official PostgreSQL image. This
    # avoids requiring a Docker Hub login for local résumé/demo development.
    image: public.ecr.aws/docker/library/postgres:17-alpine
    environment:
      POSTGRES_DB: computer_browser_use
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - cbu_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d computer_browser_use"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  cbu_postgres:
